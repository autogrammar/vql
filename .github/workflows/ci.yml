name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mcp2vql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest "mcp>=1,<3"
      - name: Test mutation safety contract
        env:
          PYTHONPATH: src:packages/dsl2vql/src:packages/mcp2vql/src
        run: python -m pytest -q packages/mcp2vql/tests/test_mcp2vql.py
